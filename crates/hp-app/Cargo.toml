[package]
name = "hp-app"
description = "Hyper Pixel desktop scanner application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hyper-pixel"
path = "src/main.rs"

[dependencies]
hp-core.workspace = true
hp-scan.workspace = true
hp-ocr.workspace = true
hp-ml.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "unstable-winit-030"] }
rfd = "0.17"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
slint-build = "1.18"
