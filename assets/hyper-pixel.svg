<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
  <title>Hyper Pixel</title>
  <!-- "Midnight Flatbed", frame E: a dark flatbed, lid raised, red laser line near the front of the glass. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f2d"/>
      <stop offset="1" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1829"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="168" height="168">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#tile)"/>
  <!-- Lid, with a faint red cast from the laser -->
  <polygon points="31,15 97,15 102,50 26,50" fill="#20242e"/>
  <polygon points="35,19 93,19 97,47 31,47" fill="#13161d"/>
  <polygon points="35,19 93,19 97,47 31,47" fill="#ff2e3a" opacity="0.076"/>
  <!-- Glass bed with two prints on it -->
  <polygon points="26,50 102,50 115,84 13,84" fill="#2b303c"/>
  <polygon points="30,53 98,53 107,80 21,80" fill="url(#glass)"/>
  <polygon points="60,53 70,53 56,80 45,80" fill="#ffffff" opacity="0.04"/>
  <polygon points="43,58 65,57 67,69 42,70" fill="#22314d" opacity="0.8"/>
  <polygon points="70,59 87,58 90,71 70,72" fill="#3a2c48" opacity="0.8"/>
  <!-- Front of the body -->
  <path d="M13 84H115V93Q115 100 108 100H20Q13 100 13 93Z" fill="#1a1d25"/>
  <rect x="13" y="84" width="102" height="1.4" fill="#4a5163"/>
  <rect x="22" y="90.5" width="22" height="2.4" rx="1.2" fill="#2c313c"/>
  <circle cx="104" cy="92" r="2" fill="#38f28a"/>
  <!-- Laser line: glow, then core -->
  <line x1="23.22" y1="73.4" x2="104.78" y2="73.4" stroke="#ff2e3a" stroke-width="8" opacity="0.75" filter="url(#glow)"/>
  <line x1="23.22" y1="73.4" x2="104.78" y2="73.4" stroke="#ffe1e1" stroke-width="1.4"/>
</svg>
